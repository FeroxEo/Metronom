<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ECEFED" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1514" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Metronom">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Metronom</title>
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
/* Layout: ein Bildschirm ohne Scrollen. Oben Übungen und Einstellungen, in der Mitte Schlaganzeige und Tempo, unten Start. Taktart liegt in einem Einstellungsblatt. */
:root {
  --bg: #ECEFED;
  --surface: #F8FAF9;
  --ink: #17201E;
  --muted: #5B6A66;
  --line: #D0D8D5;
  --tile: #D3DBD8;
  --tile-strong: #9BADA8;
  --accent: #0B6E76;
  --accent-ink: #FFFFFF;
  --danger: #B3261E;
  --font-display: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1514;
    --surface: #172120;
    --ink: #E8EFED;
    --muted: #93A29E;
    --line: #283533;
    --tile: #233230;
    --tile-strong: #4F6560;
    --accent: #46C2CB;
    --accent-ink: #08201F;
    --danger: #FF8A80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1514;
  --surface: #172120;
  --ink: #E8EFED;
  --muted: #93A29E;
  --line: #283533;
  --tile: #233230;
  --tile-strong: #4F6560;
  --accent: #46C2CB;
  --accent-ink: #08201F;
  --danger: #FF8A80;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  padding-block: 10px 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

/* Oben: Übungen */
.top { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; }
.chips { flex: 1 1 auto; min-width: 0; display: flex; gap: 8px; overflow-x: auto; padding: 2px 0; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; max-width: 70%; height: 44px; padding: 0 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .dot { display: inline-block; width: 7px; height: 7px; margin-left: 8px; border-radius: 50%; background: var(--accent); vertical-align: middle; }
.chips .none { align-self: center; font-size: 14px; color: var(--muted); white-space: nowrap; }
.gear { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; }
.gear svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Mitte */
.main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: space-evenly; }
.beats { display: flex; align-items: flex-end; gap: 6px; height: clamp(48px, 9vh, 72px); }
.tile { flex: 1 1 0; min-width: 0; height: 62%; border-radius: 8px; background: var(--tile); transition: background-color .05s linear; }
.tile.acc { height: 100%; background: var(--tile-strong); }
.tile.on { background: var(--accent); }
.sigtxt { margin: 6px 0 0; text-align: center; font-size: 13px; color: var(--muted); letter-spacing: .06em; font-variant-numeric: tabular-nums; }

.bpmrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.rbtn { flex: 0 0 auto; width: clamp(60px, 9vh, 72px); aspect-ratio: 1; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 34px; line-height: 1; display: grid; place-items: center; padding: 0; }
.rbtn:active { background: var(--tile); }
.bpmbox { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; align-items: center; }
.bpmbox input { width: 100%; max-width: 4ch; border: 0; border-bottom: 2px solid transparent; background: transparent; text-align: center; font-family: var(--font-display); font-size: clamp(64px, 13vh, 100px); font-weight: 300; line-height: 1.05; font-variant-numeric: tabular-nums; padding: 0; border-radius: 0; -moz-appearance: textfield; appearance: textfield; }
.bpmbox input::-webkit-outer-spin-button, .bpmbox input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.bpmbox input:focus-visible { outline: none; border-bottom-color: var(--accent); }
.unit { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.term { font-size: 15px; font-style: italic; color: var(--muted); min-height: 1.4em; }
.fac { font-size: 15px; font-weight: 600; color: var(--accent); min-height: 1.4em; font-variant-numeric: tabular-nums; }

/* Unten */
.bottom { flex: 0 0 auto; display: flex; flex-direction: column; gap: 10px; }
.go { width: 100%; height: 68px; border: 0; border-radius: 18px; background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-size: 22px; font-weight: 650; letter-spacing: .02em; }
.go.run { background: var(--ink); color: var(--bg); }
.fine { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.btn, .fine button { height: 52px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); font-weight: 550; }
.btn:active, .fine button:active { background: var(--tile); }

/* Einstellungen */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; padding-block: max(12px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheetin { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.shead { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.shead h1 { font-family: var(--font-display); font-size: 22px; font-weight: 650; margin: 0; }
.done { height: 44px; padding: 0 20px; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.card h2 { margin: 0; font-family: var(--font-display); font-size: 17px; font-weight: 650; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.lbl { font-size: 15px; }
.sig { display: flex; align-items: center; gap: 10px; }
.sbtn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-size: 22px; padding: 0; }
.sbtn:active { background: var(--tile); }
.signum { font-family: var(--font-display); font-size: 28px; font-weight: 600; min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; }
.slash { font-size: 28px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { width: 48px; height: 44px; border: 0; background: var(--bg); font-family: var(--font-display); font-size: 20px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.switch { width: 52px; height: 32px; border-radius: 999px; border: 1px solid var(--line); background: var(--tile); position: relative; padding: 0; flex: 0 0 auto; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); transition: transform .12s ease; }
.switch[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.note { margin: 0; font-size: 13px; color: var(--muted); }

.save { display: flex; gap: 8px; }
.txt { flex: 1 1 auto; min-width: 0; height: 48px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); padding: 0 12px; }
.save .btn { flex: 0 0 auto; padding: 0 16px; height: 48px; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.exlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.ex { border: 1px solid var(--line); border-radius: 14px; background: var(--bg); overflow: hidden; }
.ex.act { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.exrow { display: flex; align-items: stretch; }
.exload { flex: 1 1 auto; min-width: 0; text-align: left; border: 0; background: transparent; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.exname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.exmeta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.exedit { flex: 0 0 auto; border: 0; border-left: 1px solid var(--line); background: transparent; padding: 0 14px; font-size: 14px; color: var(--muted); }
.expanel { border-top: 1px solid var(--line); padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.expanel label { font-size: 13px; color: var(--muted); }
.btnrow { display: flex; flex-direction: column; gap: 8px; }
.btnrow .btn { height: 46px; }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.diag { margin: 0; font-size: 12px; line-height: 1.5; white-space: pre-wrap; color: var(--muted); font-variant-numeric: tabular-nums; max-height: 240px; overflow: auto; }
.empty { margin: 0; font-size: 14px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  .tile, .switch::after { transition: none; }
}
</style>
</head>
<body>

<main class="app">
  <header class="top">
    <div id="chips" class="chips" role="group" aria-label="Gespeicherte Übungen"></div>
    <button id="gear" class="gear" type="button" aria-label="Einstellungen öffnen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><circle cx="9" cy="7" r="2.4"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="15" cy="17" r="2.4"/></svg>
    </button>
  </header>

  <div class="main">
    <section aria-label="Schlaganzeige">
      <div id="beats" class="beats" aria-hidden="true"></div>
      <p id="sigtxt" class="sigtxt"></p>
    </section>

    <section class="bpmrow" aria-label="Tempo">
      <button id="minus" class="rbtn" type="button" aria-label="Tempo um 1 senken">&minus;</button>
      <div class="bpmbox">
        <input id="bpm" type="number" inputmode="numeric" min="30" max="300" step="1" value="100" aria-label="Tempo in Schlägen pro Minute">
        <span class="unit">BPM</span>
        <span id="term" class="term"></span>
        <span id="fac" class="fac"></span>
      </div>
      <button id="plus" class="rbtn" type="button" aria-label="Tempo um 1 erhöhen">+</button>
    </section>
  </div>

  <div class="bottom">
    <button id="go" class="go" type="button" aria-pressed="false">Start</button>
    <div class="fine">
      <button id="m10" type="button">&minus;10&nbsp;%</button>
      <button id="tap" type="button">Tap</button>
      <button id="p10" type="button">+10&nbsp;%</button>
    </div>
  </div>
</main>

<div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheettitle" hidden>
  <div class="sheetin">
    <div class="shead">
      <h1 id="sheettitle">Einstellungen</h1>
      <button id="sheetdone" class="done" type="button">Fertig</button>
    </div>

    <section class="card" aria-label="Taktart">
      <h2>Taktart</h2>
      <div class="row">
        <div class="sig">
          <button id="nm" class="sbtn" type="button" aria-label="Einen Schlag weniger">&minus;</button>
          <span id="num" class="signum">4</span>
          <button id="np" class="sbtn" type="button" aria-label="Einen Schlag mehr">+</button>
          <span class="slash">/</span>
          <div class="seg" role="group" aria-label="Notenwert">
            <button id="d4" type="button" aria-pressed="true">4</button>
            <button id="d8" type="button" aria-pressed="false">8</button>
          </div>
        </div>
      </div>
      <div class="row">
        <span id="acclbl" class="lbl">Betonung auf der 1</span>
        <button id="accsw" class="switch" type="button" role="switch" aria-checked="true" aria-labelledby="acclbl"></button>
      </div>
      <p class="note">BPM zählt jeden Schlag der Taktart, bei 6/8 also jedes Achtel.</p>
    </section>

    <section class="card" aria-label="Übungen">
      <h2>Übungen</h2>
      <p class="note">Speichert Tempo, Taktart und Betonung, die gerade eingestellt sind.</p>
      <div class="save">
        <input id="exname" class="txt" type="text" maxlength="40" placeholder="Name, z. B. Tonleiter C-Dur" aria-label="Name der neuen Übung">
        <button id="exsave" class="btn" type="button">Speichern</button>
      </div>
      <ul id="exlist" class="exlist"></ul>
    </section>

    <section class="card" aria-label="Diagnose">
      <h2>Diagnose</h2>
      <p id="ver" class="note"></p>
      <pre id="diag" class="diag"></pre>
    </section>
  </div>
</div>

<script>
(function () {
  'use strict';
  var SR = 44100, MIN = 30, MAX = 300, KEY = 'metronom-v1';
  var $ = function (id) { return document.getElementById(id); };

  var S = { bpm: 100, base: 100, fac: 1, num: 4, den: 4, accentOn: true, playing: false, activeId: null };
  var exercises = [];
  var editingId = null, confirmDel = null;

  var audio = new Audio();
  audio.loop = true;
  audio.preload = 'auto';
  audio.setAttribute('playsinline', '');
  var loaded = { url: null, barDur: 0, beatDur: 0, num: 0 };
  var dirty = true, swapping = false, useData = false, rebuildTimer = 0, raf = 0;
  var tiles = [], lastIdx = -1, refCT = -1, refPerf = 0;

  function clamp(v) { v = Math.round(Number(v)); if (!isFinite(v)) v = 100; return Math.min(MAX, Math.max(MIN, v)); }
  function clampN(v) { v = Math.round(Number(v)); if (!isFinite(v)) v = 4; return Math.min(12, Math.max(1, v)); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  /* ---------- Protokoll (Fehlersuche Sperrbildschirm) ---------- */
  var VERSION = 'v4', diag = [];
  function dlog(m) {
    var d = new Date(), z = function (n) { return (n < 10 ? '0' : '') + n; };
    diag.unshift(z(d.getHours()) + ':' + z(d.getMinutes()) + ':' + z(d.getSeconds()) + ' ' + m);
    if (diag.length > 30) diag.pop();
    var el = document.getElementById('diag');
    if (el) el.textContent = diag.join('\n');
  }

  /* ---------- Speicher ---------- */
  function valid(e) { return e && typeof e.id === 'string' && typeof e.name === 'string'; }
  function loadState() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var d = JSON.parse(raw);
      if (d && Array.isArray(d.exercises)) {
        exercises = d.exercises.filter(valid).map(function (e) {
          return { id: e.id, name: e.name, bpm: clamp(e.bpm), num: clampN(e.num), den: e.den === 8 ? 8 : 4, accentOn: e.accentOn !== false };
        });
      }
      var l = d && d.last;
      if (l) {
        S.bpm = clamp(l.bpm);
        S.base = clamp(l.base || l.bpm);
        S.fac = Number(l.fac) || 1;
        if (Math.round(S.base * S.fac) !== S.bpm) { S.base = S.bpm; S.fac = 1; }
        S.num = clampN(l.num);
        S.den = l.den === 8 ? 8 : 4;
        S.accentOn = l.accentOn !== false;
        S.activeId = exercises.some(function (e) { return e.id === l.activeId; }) ? l.activeId : null;
      }
    } catch (err) { /* Speicher nicht verfügbar */ }
  }
  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        exercises: exercises,
        last: { bpm: S.bpm, base: S.base, fac: S.fac, num: S.num, den: S.den, accentOn: S.accentOn, activeId: S.activeId }
      }));
    } catch (err) { /* ignorieren */ }
  }

  /* ---------- Klang: Web Audio, lückenlose Schleife ---------- */
  var ctx = null, master = null, src = null, t0 = 0, curBeat = 0.6, curNum = 4;
  var clickCache = {}, silentUrl = null, silentFallback = false;

  dlog('audioSession: ' + (navigator.audioSession ? 'vorhanden, Typ ' + navigator.audioSession.type + ' (unverändert)' : 'nicht vorhanden'));

  function getCtx() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      try { ctx = new AC({ latencyHint: 'playback' }); } catch (err) { ctx = new AC(); }
      master = ctx.createGain();
      master.gain.value = 1;
      master.connect(ctx.destination);
      ctx.onstatechange = function () {
        dlog('Audio: ' + ctx.state);
        if (S.playing && ctx.state !== 'running') { try { ctx.resume(); } catch (err) { /* ignorieren */ } }
      };
    }
    return ctx;
  }

  /* Holzblock: kurzer Rauschimpuls, zwei schnell abklingende Töne */
  function clickBuf(acc, sr) {
    var k = (acc ? 'a' : 'n') + sr;
    if (clickCache[k]) return clickCache[k];
    var fr = acc ? 1650 : 1100, amp = acc ? 1 : 0.9, len = Math.round(sr * 0.09), b = new Float32Array(len), i, t, env, s;
    for (i = 0; i < len; i++) {
      t = i / sr;
      env = Math.exp(-t / 0.016) * Math.min(1, i / 16);
      s = Math.sin(2 * Math.PI * fr * t) + 0.6 * Math.sin(2 * Math.PI * fr * 2.76 * t) * Math.exp(-t / 0.008);
      b[i] = amp * 0.7 * env * s;
    }
    clickCache[k] = b;
    return b;
  }
  function buildBuffer() {
    var sr = ctx.sampleRate, beatSamp = sr * 60 / S.bpm, barSamp = beatSamp * S.num;
    var bars = Math.max(1, Math.round(6 * sr / barSamp));
    var total = Math.round(bars * barSamp);
    var buf = ctx.createBuffer(1, total, sr), f = buf.getChannelData(0), b, i, k, start, cb;
    for (b = 0; b < bars; b++) {
      for (i = 0; i < S.num; i++) {
        start = Math.round((b * S.num + i) * beatSamp);
        cb = clickBuf(S.accentOn && i === 0, sr);
        for (k = 0; k < cb.length; k++) f[(start + k) % total] += cb[k];
      }
    }
    curBeat = 60 / S.bpm;
    curNum = S.num;
    return buf;
  }
  function playBuffer(offset, when) {
    var old = src, s = ctx.createBufferSource();
    s.buffer = buildBuffer();
    s.loop = true;
    s.connect(master);
    s.start(when, offset);
    if (old) {
      try { old.stop(when); } catch (err) { /* ignorieren */ }
      old.onended = function () { try { old.disconnect(); } catch (err) { /* ignorieren */ } };
    }
    src = s;
    t0 = when - offset;
  }
  function rebuildLive() {
    if (!S.playing || !ctx || !src) return;
    var now = ctx.currentTime;
    if (now < t0) { playBuffer(0, t0); return; }
    var beatPos = ((now - t0) / curBeat) % curNum;
    var nb = 60 / S.bpm;
    playBuffer((beatPos % S.num) * nb, now + 0.005);
  }

  /* Stiller Hintergrundton hält Wiedergabe und Sperrbildschirm-Anzeige am Leben */
  function silentWav() {
    var sr = 8000, n = sr * 60, bytes = new Uint8Array(44 + n * 2), dv = new DataView(bytes.buffer), i;
    function str(o, s) { for (var j = 0; j < s.length; j++) dv.setUint8(o + j, s.charCodeAt(j)); }
    str(0, 'RIFF'); dv.setUint32(4, 36 + n * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
    dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
    dv.setUint32(24, sr, true); dv.setUint32(28, sr * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
    str(36, 'data'); dv.setUint32(40, n * 2, true);
    for (i = 0; i < n; i++) dv.setInt16(44 + i * 2, i % 2 ? 2 : -2, true);
    return bytes;
  }
  function silentSrc() {
    var bytes = silentWav();
    if (!silentFallback) return URL.createObjectURL(new Blob([bytes], { type: 'audio/wav' }));
    var s = '', CH = 0x8000, i;
    for (i = 0; i < bytes.length; i += CH) s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    return 'data:audio/wav;base64,' + btoa(s);
  }
  function keepAlive() {
    if (!silentUrl) { silentUrl = silentSrc(); audio.src = silentUrl; }
    var p = audio.play();
    if (p && p.catch) p.catch(function (e) { dlog('Hintergrundton abgelehnt: ' + (e && e.name)); });
  }
  audio.addEventListener('error', function () {
    if (!silentFallback) {
      silentFallback = true; silentUrl = silentSrc(); audio.src = silentUrl;
      if (S.playing) keepAlive();
    }
  });
  audio.addEventListener('pause', function () { if (S.playing) stop(); });

  /* Falls iOS die Sperrbildschirm-Tasten als Vor-/Zurückspulen im Hintergrundton ausführt (Home-Bildschirm-App):
     Der Sprung wird als Tempo +1 / -1 gedeutet. */
  ['play', 'playing', 'pause', 'seeking', 'error', 'stalled', 'waiting', 'ended'].forEach(function (ev) { audio.addEventListener(ev, function () { dlog('Ton: ' + ev); }); });
  var LOOPLEN = 60, lastCT = 0, lastCTwall = 0, handledUntil = 0, lastBump = 0;
  function bump(dir) {
    var n = performance.now();
    if (n - lastBump < 400) return;
    lastBump = n;
    setBpm(S.bpm + dir, true);
  }
  var tuCount = 0;
  audio.addEventListener('timeupdate', function () {
    lastCT = audio.currentTime; lastCTwall = performance.now();
    if (++tuCount % 20 === 1) dlog('Ton läuft: ' + audio.currentTime.toFixed(1) + ' s');
  });
  audio.addEventListener('seeking', function () {
    if (!S.playing || performance.now() < handledUntil) return;
    var expected = lastCT + (performance.now() - lastCTwall) / 1000;
    var d = (((audio.currentTime - expected) % LOOPLEN) + LOOPLEN) % LOOPLEN;
    if (d > LOOPLEN / 2) d -= LOOPLEN;
    dlog('Sprung ' + d.toFixed(1) + ' s');
    if (d >= 5 && d <= 40) bump(1);
    else if (d <= -5 && d >= -40) bump(-1);
  });
  document.addEventListener('visibilitychange', function () {
    dlog('Sichtbarkeit: ' + document.visibilityState);
    if (S.playing && ctx && ctx.state !== 'running') { try { ctx.resume(); } catch (err) { /* ignorieren */ } }
  });

  /* ---------- Start / Stopp ---------- */
  function start() {
    if (S.playing) return;
    var c = getCtx();
    try { if (c.state !== 'running') c.resume(); } catch (err) { /* ignorieren */ }
    S.playing = true;
    dlog('Start');
    playBuffer(0, c.currentTime + 0.08);
    keepAlive();
    sync();
  }
  function stop() {
    S.playing = false;
    dlog('Stopp');
    clearTimeout(rebuildTimer);
    if (src) { try { src.stop(); } catch (err) { /* ignorieren */ } src = null; }
    audio.pause();
    sync();
  }
  function toggle() { if (S.playing) stop(); else start(); }

  function tick() {
    if (!S.playing) { raf = 0; return; }
    if (ctx && ctx.state === 'running') {
      var el = ctx.currentTime - (ctx.outputLatency || ctx.baseLatency || 0) - t0;
      if (el >= 0) {
        var idx = Math.floor(((el / curBeat) % curNum) + 1e-6);
        if (idx >= curNum) idx = curNum - 1;
        if (idx !== lastIdx) { lastIdx = idx; setActive(idx); }
      }
    }
    raf = requestAnimationFrame(tick);
  }
  function setActive(idx) {
    for (var i = 0; i < tiles.length; i++) tiles[i].classList.toggle('on', i === idx);
  }

  /* ---------- Anzeige ---------- */
  function termFor(b) {
    if (b < 40) return 'Grave';
    if (b < 60) return 'Largo';
    if (b < 66) return 'Larghetto';
    if (b < 76) return 'Adagio';
    if (b < 108) return 'Andante';
    if (b < 120) return 'Moderato';
    if (b < 156) return 'Allegro';
    if (b < 176) return 'Vivace';
    if (b < 200) return 'Presto';
    return 'Prestissimo';
  }
  function renderBeats() {
    var html = '', i;
    for (i = 0; i < S.num; i++) html += '<div class="tile' + (S.accentOn && i === 0 ? ' acc' : '') + '"></div>';
    $('beats').innerHTML = html;
    tiles = Array.prototype.slice.call($('beats').children);
    lastIdx = -1;
    $('sigtxt').textContent = S.num + '/' + S.den;
  }
  function renderTempo() {
    $('bpm').value = S.bpm;
    $('term').textContent = termFor(S.bpm);
    $('fac').textContent = S.fac === 1 ? '' : '×' + S.fac.toFixed(1).replace('.', ',') + ' von ' + S.base;
  }
  function renderSig() {
    $('num').textContent = S.num;
    $('d4').setAttribute('aria-pressed', S.den === 4 ? 'true' : 'false');
    $('d8').setAttribute('aria-pressed', S.den === 8 ? 'true' : 'false');
    $('accsw').setAttribute('aria-checked', S.accentOn ? 'true' : 'false');
  }
  function isSame(ex) {
    return ex.bpm === S.base && ex.num === S.num && ex.den === S.den && ex.accentOn === S.accentOn;
  }
  function renderChips() {
    var el = $('chips');
    if (!exercises.length) {
      el.innerHTML = '<span class="none">Übungen speicherst du in den Einstellungen</span>';
      return;
    }
    el.innerHTML = exercises.map(function (e) {
      var act = e.id === S.activeId;
      return '<button type="button" class="chip" data-id="' + e.id + '" aria-pressed="' + (act ? 'true' : 'false') + '">' + esc(e.name) + (act && !isSame(e) ? '<span class="dot" title="geändert"></span>' : '') + '</button>';
    }).join('');
    var a = el.querySelector('[aria-pressed="true"]');
    if (a && a.scrollIntoView) { try { a.scrollIntoView({ inline: 'nearest', block: 'nearest' }); } catch (err) { /* ignorieren */ } }
  }
  function sync() {
    var go = $('go');
    go.textContent = S.playing ? 'Stopp' : 'Start';
    go.classList.toggle('run', S.playing);
    go.setAttribute('aria-pressed', S.playing ? 'true' : 'false');
    if (S.playing) { if (!raf) raf = requestAnimationFrame(tick); }
    else { if (raf) cancelAnimationFrame(raf); raf = 0; lastIdx = -1; setActive(-1); }
    updateMeta();
  }
  function exName() {
    var e = findEx(S.activeId);
    return e ? e.name : 'Metronom';
  }

  /* ---------- Sperrbildschirm ---------- */
  function updateMeta() {
    if (!('mediaSession' in navigator)) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({ title: S.bpm + ' BPM', artist: exName(), album: S.num + '/' + S.den });
      navigator.mediaSession.playbackState = S.playing ? 'playing' : 'paused';
    } catch (err) { /* ignorieren */ }
    try {
      /* Endlose Dauer: iOS zeigt dann keine Zeitleiste */
      if (navigator.mediaSession.setPositionState) navigator.mediaSession.setPositionState({ duration: Infinity, playbackRate: 1, position: 0 });
    } catch (err) { /* ignorieren */ }
  }
  function initMedia() {
    dlog('Media Session: ' + ('mediaSession' in navigator ? 'vorhanden' : 'FEHLT'));
    if (!('mediaSession' in navigator)) return;
    function set(a, f) { try { navigator.mediaSession.setActionHandler(a, f ? function () { dlog('Taste: ' + a); f(); } : null); } catch (err) { dlog('Taste nicht registrierbar: ' + a); } }
    function up() { handledUntil = performance.now() + 1500; setBpm(S.bpm + 1, true); }
    function down() { handledUntil = performance.now() + 1500; setBpm(S.bpm - 1, true); }
    set('play', function () { start(); });
    set('pause', function () { stop(); });
    set('stop', function () { stop(); });
    set('nexttrack', up);
    set('previoustrack', down);
    set('seekforward', up);
    set('seekbackward', down);
    set('seekto', null);
  }

  /* ---------- Änderungen ---------- */
  function changed(immediate) {
    dirty = true;
    var ae = findEx(S.activeId);
    if (ae) { ae.bpm = S.base; ae.num = S.num; ae.den = S.den; ae.accentOn = S.accentOn; if (!editingId) renderEx(); }
    persist();
    renderChips();
    updateMeta();
    if (S.playing) {
      clearTimeout(rebuildTimer);
      if (immediate) rebuildLive();
      else rebuildTimer = setTimeout(rebuildLive, 60);
    }
  }
  /* Manuelle Eingabe setzt das Grundtempo neu und den Faktor auf 1 zurück */
  function setBpm(v, immediate) {
    var n = clamp(v);
    if (n === S.bpm && S.fac === 1) { renderTempo(); return; }
    S.bpm = n; S.base = n; S.fac = 1;
    renderTempo(); changed(immediate);
  }
  /* Prozent-Tasten: Faktor in 0,1-Schritten auf das Grundtempo */
  function stepFactor(d) {
    var nf = Math.round((S.fac + d) * 10) / 10;
    if (nf < 0.1) return;
    var raw = S.base * nf;
    if (raw < MIN - 0.5 || raw > MAX + 0.5) return;
    S.fac = nf; S.bpm = clamp(raw);
    renderTempo(); changed();
  }
  function setNum(n) {
    n = clampN(n);
    if (n === S.num) return;
    S.num = n;
    renderSig(); renderBeats(); changed();
  }
  function setDen(d) { if (d === S.den) return; S.den = d; renderSig(); renderBeats(); changed(); }

  function holdable(btn, fn) {
    var t1 = 0, t2 = 0;
    function end() { clearTimeout(t1); clearInterval(t2); }
    btn.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      fn();
      end();
      t1 = setTimeout(function () { t2 = setInterval(fn, 70); }, 420);
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { btn.addEventListener(ev, end); });
    btn.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); } });
  }

  var taps = [];
  function tap() {
    var now = performance.now();
    if (taps.length && now - taps[taps.length - 1] > 2000) taps = [];
    taps.push(now);
    if (taps.length > 6) taps.shift();
    if (taps.length >= 2) {
      var avg = (taps[taps.length - 1] - taps[0]) / (taps.length - 1);
      setBpm(60000 / avg);
    }
  }

  /* ---------- Übungen ---------- */
  function snapshot(name, id) {
    return { id: id, name: name, bpm: S.base, num: S.num, den: S.den, accentOn: S.accentOn };
  }
  function findEx(id) { for (var i = 0; i < exercises.length; i++) if (exercises[i].id === id) return exercises[i]; return null; }
  function saveNew() {
    var inp = $('exname');
    var name = inp.value.trim() || ('Übung ' + (exercises.length + 1));
    var id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    exercises.push(snapshot(name, id));
    S.activeId = id;
    inp.value = '';
    persist(); renderEx(); renderChips(); updateMeta();
  }
  function loadEx(id) {
    var e = findEx(id);
    if (!e) return;
    S.bpm = e.bpm; S.base = e.bpm; S.fac = 1; S.num = e.num; S.den = e.den; S.accentOn = e.accentOn;
    S.activeId = id;
    renderTempo(); renderSig(); renderBeats(); renderEx();
    changed(true);
  }
  function renderEx() {
    var el = $('exlist');
    if (!exercises.length) {
      el.innerHTML = '<li class="empty">Noch keine Übungen. Stelle Tempo und Taktart ein, gib oben einen Namen ein und tippe auf Speichern.</li>';
      return;
    }
    el.innerHTML = exercises.map(function (e) {
      var act = e.id === S.activeId, ed = e.id === editingId, del = confirmDel === e.id;
      var panel = ed
        ? '<div class="expanel">' +
            '<label for="rn-' + e.id + '">Name</label>' +
            '<input id="rn-' + e.id + '" class="txt" type="text" maxlength="40" value="' + esc(e.name) + '" data-id="' + e.id + '">' +
            '<div class="btnrow">' +
              '<button type="button" class="btn" data-act="rename" data-id="' + e.id + '">Name übernehmen</button>' +
              '<button type="button" class="btn" data-act="update" data-id="' + e.id + '">Aktuelle Einstellungen übernehmen</button>' +
              '<button type="button" class="btn danger" data-act="' + (del ? 'delete' : 'ask') + '" data-id="' + e.id + '">' + (del ? 'Endgültig löschen' : 'Löschen') + '</button>' +
            '</div></div>'
        : '';
      return '<li class="ex' + (act ? ' act' : '') + '">' +
        '<div class="exrow">' +
          '<button type="button" class="exload" data-act="load" data-id="' + e.id + '"><span class="exname">' + esc(e.name) + '</span><span class="exmeta">' + e.bpm + ' BPM · ' + e.num + '/' + e.den + (e.accentOn ? '' : ' · ohne Betonung') + '</span></button>' +
          '<button type="button" class="exedit" data-act="edit" data-id="' + e.id + '" aria-expanded="' + (ed ? 'true' : 'false') + '">' + (ed ? 'Fertig' : 'Bearbeiten') + '</button>' +
        '</div>' + panel + '</li>';
    }).join('');
  }
  function rename(id) {
    var e = findEx(id), inp = document.getElementById('rn-' + id);
    if (!e || !inp) return;
    var v = inp.value.trim();
    if (v) e.name = v;
    persist(); renderEx(); renderChips(); updateMeta();
  }
  $('exlist').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-act]');
    if (!b) return;
    var id = b.getAttribute('data-id'), act = b.getAttribute('data-act'), e = findEx(id);
    if (!e) return;
    if (act === 'load') { loadEx(id); }
    else if (act === 'edit') { editingId = editingId === id ? null : id; confirmDel = null; renderEx(); }
    else if (act === 'rename') { rename(id); }
    else if (act === 'update') {
      var s = snapshot(e.name, e.id), i = exercises.indexOf(e);
      exercises[i] = s; S.activeId = id;
      persist(); renderEx(); renderChips();
    }
    else if (act === 'ask') { confirmDel = id; renderEx(); }
    else if (act === 'delete') {
      exercises = exercises.filter(function (x) { return x.id !== id; });
      if (S.activeId === id) S.activeId = null;
      editingId = null; confirmDel = null;
      persist(); renderEx(); renderChips(); updateMeta();
    }
  });
  $('exlist').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && ev.target.matches('input[data-id]')) { ev.preventDefault(); rename(ev.target.getAttribute('data-id')); }
  });
  $('exname').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); saveNew(); } });
  $('exsave').addEventListener('click', saveNew);
  $('chips').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-id]');
    if (b) loadEx(b.getAttribute('data-id'));
  });

  /* ---------- Einstellungsblatt ---------- */
  function openSheet() { $('sheet').hidden = false; $('sheetdone').focus(); }
  function closeSheet() { $('sheet').hidden = true; editingId = null; confirmDel = null; renderEx(); $('gear').focus(); }
  $('gear').addEventListener('click', openSheet);
  $('sheetdone').addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('sheet').hidden) closeSheet(); });

  /* ---------- Verdrahtung ---------- */
  holdable($('minus'), function () { setBpm(S.bpm - 1); });
  holdable($('plus'), function () { setBpm(S.bpm + 1); });
  $('m10').addEventListener('click', function () { stepFactor(-0.1); });
  $('p10').addEventListener('click', function () { stepFactor(0.1); });
  $('tap').addEventListener('click', tap);
  $('go').addEventListener('click', toggle);
  $('bpm').addEventListener('change', function (e) { setBpm(e.target.value); });
  $('bpm').addEventListener('keydown', function (e) { if (e.key === 'Enter') e.target.blur(); });
  $('bpm').addEventListener('focus', function (e) { e.target.select(); });
  $('nm').addEventListener('click', function () { setNum(S.num - 1); });
  $('np').addEventListener('click', function () { setNum(S.num + 1); });
  $('d4').addEventListener('click', function () { setDen(4); });
  $('d8').addEventListener('click', function () { setDen(8); });
  $('accsw').addEventListener('click', function () { S.accentOn = !S.accentOn; renderSig(); renderBeats(); changed(); });

  loadState();
  renderTempo(); renderSig(); renderBeats(); renderEx(); renderChips();
  initMedia(); sync();
  $('ver').textContent = 'Version ' + VERSION + '. Nach Druck auf die Sperrbildschirm-Tasten hier nachsehen, was angekommen ist.';
  dlog('App gestartet');
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { /* ohne Offline-Speicher weiter */ });
  });
}
</script>
